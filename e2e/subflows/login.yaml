# Connexion par lien magique (docs/05 parcours 2), utilisée par les autres flows.
# Variable : EMAIL. Le Supabase local et Mailpit doivent tourner (npm run db:start).
appId: com.zeve.app
---
- launchApp:
    clearState: true
# Sur l'émulateur, le lancement qui suit l'effacement des données échoue parfois sans erreur
# (écran d'accueil d'Android) : une seconde tentative si l'écran de connexion n'apparaît pas.
- extendedWaitUntil:
    visible: "Continuer avec un e-mail"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Continuer avec un e-mail"
    commands:
      - launchApp
- extendedWaitUntil:
    visible: "Continuer avec un e-mail"
    timeout: 15000
- runScript: ../scripts/clear-mailbox.js
- tapOn: "Continuer avec un e-mail"
# Champ identifié par son testID (resource-id Android) : le texte indicatif n'est pas fiable.
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
# Clavier fermé et mise en page stabilisée avant de toucher le bouton d'envoi : pendant que la
# vue s'ajuste au clavier, le bouton se déplace et un tap peut tomber à côté. (La touche Entrée
# matérielle ne déclenche pas l'action « Envoyer » du clavier virtuel.)
- hideKeyboard
- waitForAnimationToEnd
- tapOn: "Recevoir un lien de connexion"
# Pas d'assertion sur le toast « Lien envoyé » ni sur « Connexion en cours » : ils sont
# transitoires et tapOn/openLink attendent que l'écran se stabilise, souvent plus longtemps
# qu'ils ne restent affichés. La preuve de l'envoi est l'e-mail dans Mailpit (le script attend).
- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: ../scripts/magic-link.js
          env:
            EMAIL: ${EMAIL}
- openLink: ${output.link}
# Chaque flow attend ensuite son écran d'arrivée (Jardin, Rappels…).
