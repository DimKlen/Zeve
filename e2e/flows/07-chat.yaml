# docs/05 parcours 7 — chat : fiche → « Une question » → suggestion « Engrais ? » → points → réponse.
# Réponse déterministe : CHAT_MOCK=1 dans supabase/functions/.env.
appId: com.zeve.app
name: 07 — Chat
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: camille@zeve.test
- extendedWaitUntil:
    visible: "Gaston, .*"
    timeout: 15000
- tapOn: "Gaston, .*"
- extendedWaitUntil:
    visible: "Gaston a soif"
    timeout: 10000
# La carte du chat est sous le pli de la fiche.
- scrollUntilVisible:
    element: "Poser une question sur Gaston"
    direction: DOWN
- tapOn: "Poser une question sur Gaston"
- assertVisible: "Salut.*Je suis Gaston.*"
# Les suggestions défilent horizontalement : « Engrais ? » est hors de l'écran au départ.
- swipe:
    from: "Faut-il rempoter.*"
    direction: LEFT
- tapOn: "Engrais.*"
- extendedWaitUntil:
    visible: "Merci de prendre soin de moi.*"
    timeout: 20000
- assertVisible: "Me rappeler dans 3 jours"
- tapOn: "Me rappeler dans 3 jours"
