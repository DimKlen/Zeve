# docs/05 parcours 6 — ajout par la liste : « fic » → Figuier lyre → Changer → Cactus & succulentes
# → Echeveria → Ajouter au jardin → Plante ajoutée → fiche en Pousse.
appId: com.zeve.app
name: 06 — Ajout par la liste
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: camille@zeve.test
- extendedWaitUntil:
    visible: "Ajouter une plante"
    timeout: 15000
- tapOn: "Ajouter une plante"
- assertVisible: "Nouvelle plante"
- assertVisible: "Choisis d.abord son espèce"
# Nom suggéré (univers japonais, grec, égyptien…) et jardin présélectionné.
- assertVisible:
    id: "plant-name"
- assertVisible: "Autre nom"
- assertVisible: "Paris 1"
- tapOn: "Choisir dans la liste.*"
- assertVisible: "220 espèces · 19 types"
- tapOn:
    id: "species-search"
- inputText: "fic"
- extendedWaitUntil:
    visible: "13 espèces"
    timeout: 5000
# Le clavier masque le bas de la liste (Figuier lyre).
- hideKeyboard
- assertVisible: "Ficus benjamina, .*"
# 13 résultats : Figuier lyre est plus bas dans la liste.
- scrollUntilVisible:
    element: "Figuier lyre, .*"
    direction: DOWN
- tapOn: "Figuier lyre, .*"
- assertVisible: "Espèce choisie"
- assertVisible: "Figuier lyre"
- tapOn: "Changer"
- tapOn: "Cactus & succulentes"
- scrollUntilVisible:
    element: "Echeveria, .*"
    direction: DOWN
- tapOn: "Echeveria, .*"
- assertVisible: "Echeveria"
- tapOn:
    id: "plant-name"
# Le nom suggéré est pré-rempli : on l'efface avant d'écrire le sien.
- eraseText: 30
- inputText: "Lianne"
- hideKeyboard
# Les options de lumière sont sous le pli, derrière le bouton fixe « Ajouter au jardin ».
- scrollUntilVisible:
    element: "Ombre, loin des fenêtres"
    direction: DOWN
    centerElement: true
- tapOn: "Ombre, loin des fenêtres"
- tapOn: "Ajouter au jardin"
- extendedWaitUntil:
    visible: "Lianne est chez elle.*"
    timeout: 15000
- tapOn: "Voir sa fiche"
- extendedWaitUntil:
    visible: "Lianne est en forme"
    timeout: 10000
# La carte « Croissance » est masquée (SHOW_GROWTH_CARD) : on vérifie l'espèce et la pièce de la fiche.
- assertVisible: "Echeveria elegans · .*"
