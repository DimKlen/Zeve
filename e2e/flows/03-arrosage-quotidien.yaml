# docs/05 parcours 3 — arrosage depuis le jardin : « J'ai arrosé » sur Gaston → ✓ Arrosé + toast,
# sous-titre « 1 a soif aujourd'hui ».
appId: com.zeve.app
name: 03 — Arrosage quotidien
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: camille@zeve.test
- extendedWaitUntil:
    visible: "À arroser aujourd'hui"
    timeout: 15000
# La première ligne est la plus assoiffée : Gaston (9 j sans eau).
- assertVisible: "Salon · 9 j sans eau"
- tapOn:
    text: "J'ai arrosé"
    index: 0
- assertVisible: "Gaston te dit merci.*"
- assertVisible: "Arrosé"
- assertVisible: "6 plantes · 1 a soif aujourd.hui"
- assertVisible: "Gaston, .*Arrosée · eau dans 8 j"
