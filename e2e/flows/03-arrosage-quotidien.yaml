# docs/05 parcours 3 — arrosage depuis le jardin : « J'ai arrosé » sur Gaston → ✓ Arrosé + toast,
# sous-titre « 1 a soif aujourd'hui ».
appId: com.zeve.app
name: 03 — Arrosage quotidien
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: camille@zeve.test
- extendedWaitUntil:
    visible: "À arroser aujourd'hui"
    timeout: 15000
# Arrosages du jour de tous les jardins ; la première ligne est la plus assoiffée : Gaston.
- assertVisible: "Paris 1 · 9 j sans eau"
- tapOn:
    text: "J'ai arrosé"
    index: 0
- assertVisible: "Arrosé"
- assertVisible: "2 jardins · 1 a soif aujourd.hui"
- tapOn: "Paris 1, .*"
# Nombre de plantes libre : le flow 06 (ajout par la liste) peut avoir tourné avant.
- extendedWaitUntil:
    visible: "[0-9]+ plantes · 1 a soif aujourd.hui"
    timeout: 10000
- assertVisible: "Gaston, .*Arrosée · eau dans 8 j"
