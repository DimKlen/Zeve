# docs/05 parcours 2 — lien magique d'un compte existant (Camille, déjà onboardée) → Jardin.
appId: com.zeve.app
name: 02 — Lien magique
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: camille@zeve.test
- extendedWaitUntil:
    visible: "Mes jardins"
    timeout: 15000
- assertVisible: "2 jardins · 2 ont soif aujourd.hui"
- assertVisible: "Montréal 1, .*"
# Camille a deux jardins (Paris 1, Montréal 1) : l'accueil les liste, Gaston est dans Paris 1.
- extendedWaitUntil:
    visible: "Paris 1, .*"
    timeout: 15000
- tapOn: "Paris 1, .*"
- extendedWaitUntil:
    visible: "6 plantes · 2 ont soif aujourd.hui"
    timeout: 10000
- assertVisible: "Gaston, .*"
